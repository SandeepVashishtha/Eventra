name: Reusable CI Setup and Build

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
      working-directory:
        description: 'Directory where commands are executed'
        required: false
        type: string
        default: '.'
      build-command:
        description: 'Command to run for building the project'
        required: false
        type: string
      test-command:
        description: 'Command to run for testing the project'
        required: false
        type: string
      artifact-name:
        description: 'Name of the artifact to upload (if any)'
        required: false
        type: string
      artifact-path:
        description: 'Path of the artifact to upload (if any)'
        required: false
        type: string

jobs:
  setup-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-build-${{ hashFiles(format('{0}/**/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install Project Dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Run Tests
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Build Project
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Upload Artifacts
        if: ${{ inputs.artifact-name != '' && inputs.artifact-path != '' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
