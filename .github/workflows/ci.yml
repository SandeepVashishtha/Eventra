name: CI Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '20.x'
          - '22.x'
          - '24.x'

    uses: ./.github/workflows/reusable-setup.yml

    with:
      node-version: ${{ matrix.node-version }}
      test-command: |
        npm run lint
        npm run test
        npx playwright install --with-deps
        npm run test:e2e
      build-command: npm run build
      artifact-name: build-artifacts
      artifact-path: dist