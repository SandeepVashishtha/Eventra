name: CI Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-setup.yml
    with:
      node-version: '22'
      test-command: |
        npm run lint
        npm run test
        npx playwright install --with-deps
        npm run test:e2e
      build-command: npm run build
      artifact-name: build-artifacts
      artifact-path: dist
