# Local / default profile — file-based H2 so data (users, events, and the
# persisted JWT blacklist) survives restarts. Override with DB_URL /
# DB_USERNAME / DB_PASSWORD to point at any other JDBC datasource.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/eventradb;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  sql:
    init:
      mode: always
      schema-locations: classpath:oauth2-registered-client-schema.sql

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    # Dev-only fallback so the app boots without env vars. Never used in prod.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-anything-real-32b}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:dev-google-client-id}

eventra:
  api-docs:
    enabled: true
