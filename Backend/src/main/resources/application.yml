app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  auth:
    cookie:
      # Secure=true required with SameSite=None for cross-origin SPA sessions
      secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://eventra-psi.vercel.app,https://eventra.sandeepvashishtha.in}
  zkp:
    proof:
      verification-secret: ${ZKP_PROOF_VERIFICATION_SECRET:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      window: ${RATE_LIMIT_LOGIN_WINDOW:1m}
    reauth:
      capacity: ${RATE_LIMIT_REAUTH_CAPACITY:5}
      window: ${RATE_LIMIT_REAUTH_WINDOW:1m}
    signup:
      capacity: ${RATE_LIMIT_SIGNUP_CAPACITY:3}
      window: ${RATE_LIMIT_SIGNUP_WINDOW:10m}
    forgot-password:
      capacity: ${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:3}
      window: ${RATE_LIMIT_FORGOT_PASSWORD_WINDOW:15m}
    contact:
      capacity: ${RATE_LIMIT_CONTACT_CAPACITY:5}
      window: ${RATE_LIMIT_CONTACT_WINDOW:10m}
    github-proxy:
      capacity: ${RATE_LIMIT_GITHUB_PROXY_CAPACITY:30}
      window: ${RATE_LIMIT_GITHUB_PROXY_WINDOW:1m}
    google:
      capacity: ${RATE_LIMIT_GOOGLE_CAPACITY:10}
      window: ${RATE_LIMIT_GOOGLE_WINDOW:1m}
    refresh:
      capacity: ${RATE_LIMIT_REFRESH_CAPACITY:30}
      window: ${RATE_LIMIT_REFRESH_WINDOW:1m}
    validate:
      capacity: ${RATE_LIMIT_VALIDATE_CAPACITY:20}
      window: ${RATE_LIMIT_VALIDATE_WINDOW:1m}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}

spring:
  profiles:
    default: dev
  flyway:
    # Flyway is on the classpath for Postgres deployments, but must stay off
    # for the H2-based dev/test profiles (the migration chain assumes the
    # Hibernate-managed schema). Enable it explicitly on Postgres profiles.
    enabled: ${FLYWAY_ENABLED:false}
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: ${EVENTRA_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${EVENTRA_MAX_UPLOAD_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  forward-headers-strategy: framework

# Secure default: OpenAPI/Swagger is off unless a profile enables it (dev).
eventra:
  api-docs:
    enabled: ${EVENTRA_API_DOCS_ENABLED:false}
  max-upload-size: ${EVENTRA_MAX_UPLOAD_SIZE:10485760}

springdoc:
  api-docs:
    enabled: ${eventra.api-docs.enabled:false}
  swagger-ui:
    enabled: ${eventra.api-docs.enabled:false}
