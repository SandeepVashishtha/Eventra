spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventra
    username: eventra_user
    password: eventra_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
